<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>有智青年 AI市集 · AI市集早报</title>
<link rel="icon" href="./assets/logo.png">
<!-- 由 build_index.py 根据各期早报页面自动生成，请勿手改；改样式请改 hub_template.html -->
<style>
  :root {
    --cream: #fef8ec;
    --paper: #fffdf8;
    --lime: #c6f432;
    --lime-wash: #f1fbcf;
    --ink: #141414;
    --body: #2e2b26;
    --muted: #7a7366;
    --line: rgba(20, 20, 20, .09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--body);
    font: 16px/1.75 "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  .mk { position: relative; z-index: 0; white-space: nowrap; }
  .mk::after {
    content: ""; position: absolute; z-index: -1;
    left: -.06em; right: -.1em; bottom: .04em; height: .26em;
    border-radius: .2em; background: var(--lime); transform: rotate(-2deg);
  }

  /* hero（与早报页一致） */
  .hero { position: relative; overflow: hidden; padding: 44px 0 40px; }
  .hero::before {
    content: ""; position: absolute; right: -160px; top: -200px; width: 560px; height: 440px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(198, 244, 50, .22), rgba(254, 248, 236, 0) 70%);
  }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; color: var(--ink); letter-spacing: .04em; }
  .brand img { height: 38px; }
  h1 { margin-top: 14px; font-size: clamp(48px, 9vw, 76px); line-height: 1; font-weight: 900; color: var(--ink); letter-spacing: .02em; }
  .issue {
    display: inline-block; margin-top: 22px; padding: 7px 22px 7px 18px; background: var(--lime);
    color: var(--ink); font-weight: 800; font-style: italic; font-size: 18px; letter-spacing: .04em;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); text-decoration: none;
  }
  .hero-sub { margin-left: 14px; font-size: 14px; color: var(--muted); }
  .quote {
    position: relative; padding-left: 28px; border-left: 2px solid rgba(20, 20, 20, .14);
    font-size: 24px; line-height: 1.6; font-weight: 800; color: var(--ink); letter-spacing: .03em; margin-bottom: 6px;
  }

  /* 搜索 + 筛选 */
  .intro { max-width: 640px; margin-top: 16px; font-size: 16px; color: var(--muted); }
  .tools { display: flex; flex-direction: column; gap: 14px; }
  .search { position: relative; }
  .search input {
    width: 100%; height: 54px; padding: 0 20px 0 50px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); font: inherit; font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(198, 244, 50, .55); }
  .search svg { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); font: inherit; font-size: 15px; font-weight: 700; color: var(--body); cursor: pointer; transition: background .15s;
  }
  .pill:hover { background: var(--lime-wash); }
  .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pill .c { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill[aria-pressed="true"] .c { color: var(--lime); }
  .time { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--muted); }
  .time select {
    height: 38px; padding: 0 34px 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper);
    font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 18px) 16px, calc(100% - 13px) 16px; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .count { margin: 26px 0 14px; font-size: 14px; color: var(--muted); }
  .count b { color: var(--ink); font-weight: 900; }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(20, 20, 20, .35); }
  .card-link { display: block; text-decoration: none; }
  .cover { aspect-ratio: 16 / 9; border-bottom: 1px solid var(--line); overflow: hidden; }
  .cover.img { background: var(--cream); }
  .cover.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.type {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 18px 20px;
    background: radial-gradient(ellipse at 100% 0, rgba(198, 244, 50, .55), rgba(241, 251, 207, 0) 60%), var(--lime-wash);
  }
  .cv-no { position: absolute; top: 14px; left: 18px; font: 900 15px/1 "Bahnschrift", "DIN Alternate", sans-serif; color: var(--ink); background: var(--lime); padding: 6px 9px; border-radius: 8px; }
  .cv-stat { font-size: 26px; line-height: 1.25; font-weight: 900; color: var(--ink); }
  .cv-line { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .card-body { flex: 1; padding: 16px 20px 6px; }
  .card-tags { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card h3 { margin-top: 10px; font-size: 19px; line-height: 1.4; font-weight: 900; color: var(--ink); }
  .kw { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .sum { margin-top: 8px; font-size: 14px; line-height: 1.65; color: var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 20px 0; padding: 12px 0 16px; border-top: 1px dashed var(--line); }
  .meta { font-size: 12px; color: var(--muted); }
  .go { flex: none; padding: 5px 14px; border-radius: 999px; background: var(--lime); color: var(--ink); font-size: 14px; font-weight: 800; text-decoration: none; }
  .go:hover { background: var(--ink); color: var(--lime); }
  .card.hide { display: none; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }

  .roles { display: inline-flex; align-items: center; gap: 5px; }
  .role { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 22px; white-space: nowrap; }
  .r-product { background: #e6edfd; color: #2c52c0; }
  .r-dev { background: #ece7fb; color: #5b3fbf; }
  .r-ops { background: #fde6ee; color: #b52f5c; }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 20px; white-space: nowrap; }
  .t-green { background: #dff5e3; color: #1f7a3a; }
  .t-lime { background: #ecf6c8; color: #5d7a08; }
  .t-teal { background: #d9f3ef; color: #127a6c; }
  .t-orange { background: #ffe8d6; color: #b4541a; }
  .t-yellow { background: #fff1c4; color: #8a6400; }

  /* 往期 */
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 56px 0 14px; }
  .sec-h h2 { font-size: 22px; font-weight: 900; color: var(--ink); }
  .sec-h span { font-size: 13px; color: var(--muted); }
  .pasts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .past { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 20px 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; text-decoration: none; transition: background .15s; }
  .past:hover { background: var(--lime-wash); }
  .issue.sm { margin-top: 0; font-size: 16px; justify-self: start; }
  .past-n { font-size: 13px; color: var(--muted); }
  .past-note { grid-column: 1 / -1; font-size: 14px; color: var(--body); line-height: 1.65; }
  .past-go { grid-column: 1 / -1; font-size: 14px; font-weight: 800; color: var(--ink); }

  .end { margin: 56px 0 40px; text-align: center; color: var(--muted); font-size: 13px; }
  .end .brand { justify-content: center; font-size: 15px; margin-bottom: 6px; }
  .end .brand img { height: 28px; }

  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .hero { padding: 28px 0 24px; }
    .hero .wrap { grid-template-columns: 1fr; gap: 22px; }
    .quote { font-size: 20px; padding-left: 18px; }
    .issue { font-size: 16px; }
    .hero-sub { display: block; margin: 8px 0 0; }
    .grid, .pasts { grid-template-columns: 1fr; }
    .pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .pills::-webkit-scrollbar { display: none; }
    .pill { flex: none; }
    .bar { flex-direction: column; align-items: stretch; }
    .time select { flex: 1; }
    .search input { height: 50px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div>
      <div class="brand"><img src="./assets/logo.png" alt="">有智青年 AI市集</div>
      <h1>AI市集<span class="mk">早报</span></h1>
      <p class="intro">每期挑出值得看的 AI 新品、玩法和行业动态。按岗位、按期数找，点开任意一条直接读早报全文。</p>
      <a class="issue" href="{{LATEST_HREF}}">{{LATEST_LABEL}}</a><span class="hero-sub">共 {{ISSUE_COUNT}} 期 · {{ITEM_COUNT}} 条</span>
    </div>
    <blockquote class="quote">把重复的交给 AI，<br>把<span class="mk">判断</span>留给自己。</blockquote>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索标题、关键词或摘要，如 Agent、视频" autocomplete="off">
    </label>
    <div class="bar">
      <div class="pills" role="group" aria-label="按岗位">{{ROLE_TABS}}</div>
      <label class="time">按时间
        <select id="issueSel"><option value="">全部期数</option>
{{ISSUE_OPTIONS}}
        </select>
      </label>
    </div>
  </div>
  <p class="count" id="count">找到 <b>{{ITEM_COUNT}}</b> 条</p>
  <div class="grid" id="grid">
{{CARDS}}
  </div>
  <p class="empty" id="empty" hidden>没有找到相关内容，换个关键词试试</p>

  <div class="sec-h"><h2>往期早报</h2><span>按时间从新到旧</span></div>
  <div class="pasts">
{{PAST}}
  </div>
</main>

<footer class="end wrap">
  <div class="brand"><img src="./assets/logo.png" alt="">有智青年 AI市集</div>
  <div>AI市集早报 · 每周更新</div>
</footer>

<script>
(function () {
  var ROLES = ['product', 'dev', 'ops'];
  var q = document.getElementById('q'), sel = document.getElementById('issueSel');
  var cards = [].slice.call(document.querySelectorAll('.card'));
  var state = { role: '', issue: '', q: '' };
  function parse() {
    var s = { role: '', issue: '', q: '' };
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      var p = kv.split('='); if (p[0] in s) s[p[0]] = decodeURIComponent(p[1] || '');
    });
    if (ROLES.indexOf(s.role) < 0) s.role = '';
    if (!sel.querySelector('option[value="' + s.issue + '"]')) s.issue = '';
    return s;
  }
  function write() {
    var parts = [];
    ['role', 'issue', 'q'].forEach(function (k) { if (state[k]) parts.push(k + '=' + encodeURIComponent(state[k])); });
    history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname);
    render();
  }
  function render() {
    var words = state.q.toLowerCase().split(/\s+/).filter(Boolean), n = 0;
    cards.forEach(function (c) {
      var ok = (!state.role || c.dataset.roles.split(' ').indexOf(state.role) >= 0)
        && (!state.issue || c.dataset.issue === state.issue)
        && words.every(function (w) { return c.dataset.search.indexOf(w) >= 0; });
      c.classList.toggle('hide', !ok); if (ok) n++;
    });
    document.querySelectorAll('.pill').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.role === state.role)); });
    sel.value = state.issue; if (q.value !== state.q) q.value = state.q;
    document.getElementById('count').innerHTML = '找到 <b>' + n + '</b> 条';
    document.getElementById('empty').hidden = n > 0;
  }
  document.querySelector('.pills').addEventListener('click', function (e) {
    var b = e.target.closest('.pill'); if (b) { state.role = b.dataset.role; write(); }
  });
  sel.addEventListener('change', function () { state.issue = sel.value; write(); });
  q.addEventListener('input', function () { state.q = q.value.trim(); write(); });
  window.addEventListener('hashchange', function () { state = parse(); render(); });
  state = parse(); render();
})();
</script>
</body>
</html>
